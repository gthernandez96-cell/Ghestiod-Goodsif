<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — POS Empresarial</title>
  <meta name="description" content="Sistema de Punto de Venta Empresarial — Iniciar sesión">
  <link rel="stylesheet" href="/static/css/main.css">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    body {
      background: var(--surface-950);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }

    .login-bg .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.12;
      animation: blobFloat 8s ease-in-out infinite;
    }

    .blob-1 {
      width: 500px; height: 500px;
      background: var(--primary-600);
      top: -150px; left: -100px;
      animation-delay: 0s;
    }

    .blob-2 {
      width: 400px; height: 400px;
      background: var(--accent-500);
      bottom: -100px; right: -80px;
      animation-delay: 3s;
    }

    .blob-3 {
      width: 300px; height: 300px;
      background: #8b5cf6;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: 1.5s;
    }

    @keyframes blobFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(20px, -20px) scale(1.05); }
    }

    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: var(--border-radius-xl);
      padding: 40px;
      box-shadow: var(--glass-shadow), 0 0 60px rgba(37, 99, 235, 0.08);
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo .logo-icon {
      width: 64px; height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--primary-600), var(--accent-500));
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      font-size: 30px;
      color: white;
      box-shadow: 0 0 40px rgba(37, 99, 235, 0.4);
    }

    .login-logo h1 {
      font-size: 22px;
      font-weight: 800;
      color: white;
      margin-bottom: 6px;
    }

    .login-logo p {
      color: var(--surface-500);
      font-size: 13px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper .input-icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--surface-500);
      font-size: 18px;
    }

    .input-wrapper input {
      padding-left: 44px;
    }

    .btn-login {
      width: 100%;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary-600), var(--primary-700));
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-family: inherit;
      margin-top: 8px;
      box-shadow: 0 4px 20px rgba(37, 99, 235, 0.3);
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(37, 99, 235, 0.5);
    }

    .btn-login:active { transform: scale(0.98); }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error-message {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 8px;
      padding: 12px 14px;
      color: #f87171;
      font-size: 13px;
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .demo-creds {
      margin-top: 20px;
      padding: 14px;
      background: rgba(59, 130, 246, 0.06);
      border: 1px solid rgba(59, 130, 246, 0.15);
      border-radius: 10px;
      font-size: 12px;
      color: var(--surface-400);
      text-align: center;
    }

    .demo-creds strong { color: var(--primary-300); }
  </style>
</head>
<body>
  <div class="login-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <div class="login-container" x-data="loginPage()">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-icon">
          <i class="ph ph-storefront"></i>
        </div>
        <h1>POS Empresarial</h1>
        <p>Sistema Punto de Venta Multi-Sucursal</p>
      </div>

      <form @submit.prevent="doLogin()">
        <div class="form-group">
          <label class="form-label" for="username">Usuario o Correo</label>
          <div class="input-wrapper">
            <i class="ph ph-user input-icon"></i>
            <input
              id="username"
              class="form-control"
              type="text"
              placeholder="admin@empresa.com"
              x-model="username"
              autocomplete="username"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <div class="input-wrapper">
            <i class="ph ph-lock input-icon"></i>
            <input
              id="password"
              class="form-control"
              :type="showPassword ? 'text' : 'password'"
              placeholder="••••••••"
              x-model="password"
              autocomplete="current-password"
              required
              style="padding-right: 44px"
            >
            <button
              type="button"
              style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--surface-500);cursor:pointer;font-size:18px;padding:0"
              @click="showPassword = !showPassword"
            >
              <i class="ph" :class="showPassword ? 'ph-eye-slash' : 'ph-eye'"></i>
            </button>
          </div>
        </div>

        <div class="error-message" x-show="errorMsg" x-transition>
          <i class="ph ph-warning-circle"></i>
          <span x-text="errorMsg"></span>
        </div>

        <button class="btn-login" type="submit" :disabled="loading">
          <span x-show="!loading"><i class="ph ph-sign-in"></i> Ingresar</span>
          <span x-show="loading">
            <svg class="spinner" style="width:18px;height:18px" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" stroke-dasharray="40" stroke-dashoffset="10" style="animation:spin 0.7s linear infinite"></circle>
            </svg>
            Ingresando...
          </span>
        </button>
      </form>

      <div class="demo-creds">
        <strong>Demo:</strong> admin@empresa.com / Admin2024!
      </div>
    </div>
  </div>

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <script>
    function loginPage() {
      return {
        username: '',
        password: '',
        showPassword: false,
        loading: false,
        errorMsg: '',

        async doLogin() {
          this.loading = true;
          this.errorMsg = '';

          try {
            const formData = new URLSearchParams();
            formData.append('username', this.username);
            formData.append('password', this.password);

            const resp = await fetch('/api/v1/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: formData,
            });

            if (!resp.ok) {
              const err = await resp.json();
              this.errorMsg = err.detail || 'Credenciales incorrectas';
              return;
            }

            const data = await resp.json();
            localStorage.setItem('access_token', data.access_token);
            localStorage.setItem('refresh_token', data.refresh_token);
            localStorage.setItem('user', JSON.stringify(data.user));

            // Cargar info de la sucursal actual
            if (data.user.current_branch_id) {
              localStorage.setItem('branch', JSON.stringify({
                id: data.user.current_branch_id,
                name: 'Cargando...',
              }));
            }

            window.location.href = '/dashboard';

          } catch (e) {
            this.errorMsg = 'Error de conexión. Intenta nuevamente.';
          } finally {
            this.loading = false;
          }
        }
      }
    }
  </script>
</body>
</html>
